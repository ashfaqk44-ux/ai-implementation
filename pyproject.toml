[project]
name = "pixxi-agents"
version = "0.1.0"
description = "Agentic AI middleware for Pixxi CRM lead handling"
readme = "README.md"
# Python 3.12 (see docs/decisions.md).
requires-python = ">=3.12,<3.13"
# Direct dependencies, pinned for reproducibility.
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "tzdata==2026.6",
    "PyYAML==6.0.3",
    "langchain==1.4.9",
    "langchain-anthropic==1.7.10",
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
# Application, not an installable library: uv only manages the environment.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
