  /pixxiapi/v1/custom-contact-buttons:
    get:
      summary: List Custom Channel Buttons
      tags:
        - Custom Contact Buttons
      description: |
        Returns the account's **Custom Channel** contact buttons, enabled and disabled, oldest first. Use the `id` of a button as `buttonId` when you set or clear a record's value.

        Phone, Email and default buttons (Call, WhatsApp, Email, Telegram, 3CX) take their value from the record itself, so they aren't listed here.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of Custom Channel buttons
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Button ID. Use it as `buttonId`.
                        title:
                          type: string
                          description: Button title shown in Pixxi CRM.
                        icon:
                          type:
                            - string
                            - 'null'
                          description: Icon URL, or `null` when the button has no icon.
                        channelType:
                          type: string
                          description: Always `CUSTOM` for this endpoint.
                          enum:
                            - CUSTOM
                        websiteLinkFormat:
                          type:
                            - string
                            - 'null'
                          description: Link opened on the web. `{value}` is replaced with the record's stored value.
                        mobileLinkFormat:
                          type:
                            - string
                            - 'null'
                          description: Link opened on the mobile app. `{value}` is replaced with the record's stored value.
                        status:
                          type: string
                          description: Whether the button is shown in Pixxi CRM.
                          enum:
                            - ENABLE
                            - DIS_ENABLE
              example:
                statusCode: 200
                message: success
                data:
                  - id: 12
                    title: Chat Inbox
                    icon: https://app.example.com/icons/chat.png
                    channelType: CUSTOM
                    websiteLinkFormat: https://app.example.com/conversations/{value}
                    mobileLinkFormat: exampleapp://conversations/{value}
                    status: ENABLE
        '400':
          description: Bad request, missing or invalid X-PIXXI-TOKEN
  /pixxiapi/v1/custom-contact-buttons/value:
    get:
      summary: Get Record Values
      tags:
        - Custom Contact Buttons
      description: |
        Returns the values stored for one record, one entry per Custom Channel button that has a value. Buttons without a value for the record aren't returned.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
        - name: bizType
          in: query
          required: true
          description: Record type. See the **Custom Contact Buttons** introduction.
          schema:
            type: string
            enum:
              - LEAD
              - OWNER
              - PORTAL_LEAD
              - DATABASE
        - name: bizId
          in: query
          required: true
          description: ID of the record.
          schema:
            type: integer
      responses:
        '200':
          description: Values stored for the record
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        buttonId:
                          type: integer
                          description: ID of the Custom Channel button.
                        title:
                          type: string
                          description: Title of the button.
                        bizType:
                          type: string
                          enum:
                            - LEAD
                            - OWNER
                            - PORTAL_LEAD
                            - DATABASE
                        bizId:
                          type: integer
                        value:
                          type: string
                          description: Value that replaces `{value}` in the button links.
              example:
                statusCode: 200
                message: success
                data:
                  - buttonId: 12
                    title: Chat Inbox
                    bizType: LEAD
                    bizId: 345
                    value: abc123
        '400':
          description: Bad request, missing fields or unknown bizType
    put:
      summary: Set Record Value
      tags:
        - Custom Contact Buttons
      description: |
        Stores the value of a Custom Channel button for one record. If the record already has a value for this button, it is overwritten.

        Once a value is stored, the button appears in the record's Contact Info in Pixxi CRM and opens its link with `{value}` replaced by this value (URL encoded).

        The request is rejected when the button doesn't exist in your account, isn't a Custom Channel button, or the record doesn't exist.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - buttonId
                - bizType
                - bizId
                - value
              properties:
                buttonId:
                  type: integer
                  description: ID of a Custom Channel button, from `GET /pixxiapi/v1/custom-contact-buttons`.
                bizType:
                  type: string
                  description: Record type. See the **Custom Contact Buttons** introduction.
                  enum:
                    - LEAD
                    - OWNER
                    - PORTAL_LEAD
                    - DATABASE
                bizId:
                  type: integer
                  description: ID of the record.
                value:
                  type: string
                  maxLength: 1024
                  description: Value that replaces `{value}` in the button links, for example a conversation ID in your system. Leading and trailing spaces are removed.
              example:
                buttonId: 12
                bizType: LEAD
                bizId: 345
                value: abc123
      responses:
        '200':
          description: Value stored
          content:
            application/json:
              example:
                statusCode: 200
                message: success
        '400':
          description: Bad request, missing fields, unknown bizType, a button that isn't a Custom Channel button, or a record that doesn't exist
    delete:
      summary: Clear Record Value
      tags:
        - Custom Contact Buttons
      description: |
        Removes the value of a Custom Channel button for one record. The button then no longer appears in that record's Contact Info.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
        - name: buttonId
          in: query
          required: true
          description: ID of the Custom Channel button.
          schema:
            type: integer
        - name: bizType
          in: query
          required: true
          description: Record type. See the **Custom Contact Buttons** introduction.
          schema:
            type: string
            enum:
              - LEAD
              - OWNER
              - PORTAL_LEAD
              - DATABASE
        - name: bizId
          in: query
          required: true
          description: ID of the record.
          schema:
            type: integer
      responses:
        '200':
          description: Value cleared
          content:
            application/json:
              example:
                statusCode: 200
                message: success
        '400':
          description: Bad request, missing fields, unknown bizType or unknown button
