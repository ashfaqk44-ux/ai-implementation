                - https://pixxicrm.ae/api/profile/upload/2026/01/10/photo1.jpg
              amenities:
                - Shared Pool
                - Covered Parking
                - Balcony
              sellParam:
                completionStatus: COMPLETED
                buildYear: '2020'
                occupancy: Vacant
                totalFloor: '45'
                bathrooms: 3
                serviceCharge: '18.50'
              createTime: '2026-06-10 11:00:00'
              updateTime: '2026-06-10 11:00:00'
      responses:
        '200':
          description: Your server should respond with 200 to acknowledge receipt
  UPDATE_LISTINGS:
    post:
      summary: UPDATE_LISTINGS
      tags:
        - Events
      description: |
        This is the payload Pixxi sends to your callback URL when a **listing is updated**.

        Subscribe to this event using `POST /pixxiapi/webhook/v1/subscribe` with `event: UPDATE_LISTINGS`.
      requestBody:
        description: Payload delivered to your callback URL
        required: true
        content:
          application/json:
            example:
              id: 351047
              propertyId: '1003101351047'
              title: Luxury 2BR Apartment in Downtown Dubai - Price Reduced
              listingType: SELL
              propertyType:
                - APARTMENT
              status: ACTIVE
              price: 2350000
              bedRooms: 2
              size: 1250
              region: Downtown Dubai
              regionId: '48'
              cityId: 41
              cityName: Dubai
              community: Burj Views
              communityId: '163'
              developer: Emaar
              developerId: '12'
              isFurniture: HAS
              agent:
                name: Yaman
                email: yaman@pixxicrm.ae
                phone: '+971552250208'
              photos:
                - https://pixxicrm.ae/api/profile/upload/2026/01/10/photo1.jpg
              sellParam:
                completionStatus: COMPLETED
                buildYear: '2020'
                occupancy: Vacant
                bathrooms: 3
              createTime: '2026-06-10 11:00:00'
              updateTime: '2026-06-20 09:45:00'
      responses:
        '200':
          description: Your server should respond with 200 to acknowledge receipt
  DELETE_LISTINGS:
    post:
      summary: DELETE_LISTINGS
      operationId: deleteListingsWebhook
      tags:
        - Events
      security: []
      description: |
        This is the payload Pixxi sends to your callback URL when a **listing is deleted**.

        Subscribe to this event using `POST /pixxiapi/webhook/v1/subscribe` with `event: DELETE_LISTINGS`.

        ### When it fires
        - A listing is deleted from Pixxi CRM, either on its own or as part of a bulk delete.
        - If your account requires approval for listing deletion, the event fires only after the delete is **approved** and the listing is removed. A pending or rejected delete request sends nothing.
        - One event is sent for each deleted listing. A bulk delete of 10 listings sends 10 events.
      requestBody:
        description: Payload delivered to your callback URL
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Pixxi's internal listing ID. Matches `id` in `ADD_LISTINGS` / `UPDATE_LISTINGS`.
                propertyId:
                  type: string
                  description: The listing reference. Matches `propertyId` in `ADD_LISTINGS` / `UPDATE_LISTINGS`.
            example:
              id: 351047
              propertyId: '1003101351047'
      responses:
        '200':
          description: Your server should respond with 200 to acknowledge receipt
  ADD_NOTIFICATIONS:
    post:
      summary: ADD_NOTIFICATIONS
      tags:
        - Events
      description: |
        This is the payload Pixxi sends to your callback URL when a **new in-app notification** is created.

        Subscribe to this event using `POST /pixxiapi/webhook/v1/subscribe` with `event: ADD_NOTIFICATIONS`.
      requestBody:
        description: Payload delivered to your callback URL
        required: true
        content:
          application/json:
            example:
              id: 77001
              title: New Lead Assigned
              content: A new lead has been assigned to you.
              bizId: 842115
              bizKey: null
              propertyType: null
              bizType: LEAD
              belongTo: 2031
              isRead: 0
              isReadDetail: 0
              isReadCategory: 0
              reminderTime: null
              brightCallId: null
              createBy: 2031
              updateBy: 2031
              createTime: '2026-06-18 08:30:00'
              updateTime: '2026-06-18 08:30:00'
              userProfile:
                id: 2031
                name: Jane Agent
                email: agent@pixxicrm.ae
                phone: '+971509564799'
      responses:
        '200':
          description: Your server should respond with 200 to acknowledge receipt
  ADD_PORTAL_LEAD:
    post:
      summary: ADD_PORTAL_LEAD
      tags:
        - Events
      description: |
        This is the payload Pixxi sends to your callback URL when a **new portal lead** arrives (from Bayut, Dubizzle, or Property Finder).

        Subscribe to this event using `POST /pixxiapi/webhook/v1/subscribe` with `event: ADD_PORTAL_LEAD`.
      requestBody:
        description: Payload delivered to your callback URL
        required: true
        content:
          application/json:
            example:
              id: 9876
              leadPhoneNumber: '+971501234567'
              receiverPhoneNumber: '+971509564799'
              callStatus: ANSWERED
              leadTime: '2026-06-22 14:10:00'
              callRecordingurl: null
              source: Property Finder
              assignedAgentName: Jane Agent
              assignedAgentId: 2031
              receiverAgentId: 2031
              claimTime: null
              propertyId: 351047
              propertyType: SELL
              propertyReference: PF-ABC123
              createBy: 1
              type: PF
              updateBy: 1
              createTime: '2026-06-22 14:10:00'
              updateTime: '2026-06-22 14:10:00'
              extend: null
              newProject: null
              status: PF
              leadEmail: lead@example.com
              claimBy: null
              isTagged: 0
      responses:
        '200':
          description: Your server should respond with 200 to acknowledge receipt
  UPDATE_PORTAL_LEAD:
    post:
      summary: UPDATE_PORTAL_LEAD
      tags:
        - Events
      description: |
        This is the payload Pixxi sends to your callback URL when a **portal lead is updated** (e.g. tagged to a lead, listing, or agent).

        Subscribe to this event using `POST /pixxiapi/webhook/v1/subscribe` with `event: UPDATE_PORTAL_LEAD`.
      requestBody:
        description: Payload delivered to your callback URL
        required: true
        content:
          application/json:
            example:
              id: 9876
              leadPhoneNumber: '+971501234567'
              receiverPhoneNumber: '+971509564799'
              callStatus: ANSWERED
              leadTime: '2026-06-22 14:10:00'
              callRecordingurl: null
              source: Property Finder
              assignedAgentName: Jane Agent
              assignedAgentId: 2031
              receiverAgentId: 2031
              claimTime: '2026-06-23 09:00:00'
              propertyId: 351047
              propertyType: SELL
              propertyReference: PF-ABC123
              createBy: 1
              type: PF
              updateBy: 2031
              createTime: '2026-06-22 14:10:00'
              updateTime: '2026-06-23 10:05:00'
              extend: null
              newProject: null
              status: PF
              leadEmail: lead@example.com
              claimBy: 2031
              isTagged: 1
      responses:
        '200':
          description: Your server should respond with 200 to acknowledge receipt
  ADD_LEAD_NOTE:
    post:
      summary: ADD_LEAD_NOTE
      tags:
        - Events
      description: |
        This is the payload Pixxi sends to your callback URL when a **new note or viewing** is added to a lead.

        Subscribe to this event using `POST /pixxiapi/webhook/v1/subscribe` with `event: ADD_LEAD_NOTE`.

        ### Activity Types (`type`)
        - **`Note`**: Standard note or follow-up note added to the lead.
        - **`Viewing`**: Property viewing logged for the lead (includes `viewingStartTime`, `viewingEndTime`, and `properties`).
      requestBody:
        description: Payload delivered to your callback URL
        required: true
        content:
          application/json:
            example:
              id: 54321
              leadId: 842115
              createdBy: 2031
              message: Client called to request a viewing for 2-bedroom units in Downtown Dubai.
              type: Note
              properties:
                - propertyType: APARTMENT
                  developerId: 12
                  projectName: Burj Views
                  bedrooms: '2'
                  developerName: Emaar
              extend: null
              portal: null
              viewingStartTime: null
              viewingEndTime: null
              createTime: '2026-06-25 10:30:00'
      responses:
        '200':
          description: Your server should respond with 200 to acknowledge receipt
  ADD_REMINDER:
    post:
      summary: ADD_REMINDER
      tags:
        - Events
      description: |
        This is the payload Pixxi sends to your callback URL when a **new reminder, task, event, or viewing** is created.

        Subscribe to this event using `POST /pixxiapi/webhook/v1/subscribe` with `event: ADD_REMINDER`.

        ### Associated Object Data (`object_data`)
        The `object_data` field contains the rich external details of the associated entity depending on `object_type`:
        - **`LEADS_REMINDER`**: Lead details (`ClientVO`), including contact info, requirements, and assigned agent.
        - **`PROPERTY`** / **`PROPERTY_PERMIT_REMINDER`**: Property external VO (`PropertyExternalVo`), including title, photos, price, location, and owner.
        - **`PORTALS_REMINDER`**: External portal call log details (`ExternalCallLogExternalVO`).
        - **`DATA_BASE`** / **`RESIDENT_REMINDER`**: Resident database record details (`ResidentVO`).
        - **`CONTRACT_REMINDER`** / **`CONTRACT_RENEWAL_REMINDER`**: Contract details (`ContractVO`).
        - **`OWNER_REMINDER`**: Property owner details.
      requestBody:
        description: Payload delivered to your callback URL
        required: true
        content:
          application/json:
            example:
              id: 10521
              title: Call Client to Confirm Viewing Schedule
              description: Discuss available units in Downtown Dubai and confirm viewing date.
              createUser:
                id: 2031
                name: Jane Agent
                email: agent@pixxicrm.ae
                phone: '+971509564799'
              client:
                id: 842115
                name: John Doe
                phone: '+971501234567'
                email: john@example.com
              clientId: 842115
              object_type: LEADS_REMINDER
              object_id: 842115
              object_module: Buy Lead
              object_data:
                id: 842115
                clientType: BUY
                name: John Doe
                phone: '+971501234567'
                email: john@example.com
                nationality: United Arab Emirates
                rooms: 2|3
                budget: 1500000|2500000
                status: ACTIVE
                region: Downtown Dubai
                agentInfo:
                  id: 2031
                  name: Jane Agent
                  email: agent@pixxicrm.ae
                  phone: '+971509564799'
              participants:
                - 2031
              reminder_start_time: '2026-06-25 14:00:00'
              reminder_end_time: '2026-06-25 14:30:00'
              send_notification_before: 15
              properties: []
              status: INIT
              reminderType: LEADS_REMINDER
              message: null
              create_time: '2026-06-24 11:20:00'
              update_time: '2026-06-24 11:20:00'
      responses:
        '200':
          description: Your server should respond with 200 to acknowledge receipt
components:
  schemas:
    ListingType:
      type: string
      description: Listing type.
      enum:
        - NEW
        - SELL
        - RENT
        - POTENTIAL
    HouseType:
      type: string
      enum:
        - APARTMENT
        - VILLA
        - TOWNHOUSE
        - PENTHOUSE
        - HOTEL_APARTMENT
        - DUPLEX
        - RESIDENTIAL_FLOOR
        - RESIDENTIAL_PLOT
        - RESIDENTIAL_BUILDING
        - BULK_UNITS
        - COMPOUND
        - TWIN_HOUSE
        - TRIPLEX
        - LOFT
        - OFFICE
        - SHOP
        - COMMERCIAL_BUILDING
        - COMMERCIAL_FLOOR
        - COMMERCIAL_PLOT
        - LABOR_CAMP
        - RETAIL
        - SHOW_ROOM
        - STAFF_ACCOMMODATION
        - COMMERCIAL_VILLA
        - WAREHOUSE
        - FARM
        - FACTORY
        - HOTEL
        - HOSPITAL
        - BULK_UNITS_COMMERCIAL
        - GARAGE
        - RESTAURANT
        - BUSINESS_CENTRE
        - CO_WORKING_SPACE
        - MIXED_USE_LAND
        - INDUSTRIAL_LAND
        - OTHER_COMMERCIAL
    ListingStatus:
      type: string
      description: Listing status.
      enum:
        - DRAFT
        - ACTIVE
        - INACTIVE
        - SOLD
        - SOLD_OUT
        - RENTED
    FurnishingStatus:
      type: string
      description: '`HAS` = furnished, `NONE` = unfurnished, `PART`/`SEMI` = partly/semi furnished.'
      enum:
        - HAS
        - NONE
        - PART
        - SEMI
        - ALL
    ListingView:
      type: string
      enum:
        - SEA_VIEW
        - BURJ_KHALIFA_VIEW
        - FOUNTAIN_VIEW
        - CANAL_VIEW
        - DUBAI_EYE_VIEW
        - MARINA_VIEW
        - GOLF_VIEW
        - PARK_VIEW
        - GARDEN_VIEW
        - POOL_VIEW
        - COMMUNITY_VIEW
        - CITY_VIEW
        - ROAD_VIEW
        - CREEK_VIEW
        - PALM_VIEW
        - LAKE_VIEW
        - LAGOON_VIEW
    PortalSwitch:
      type: string
      description: Portal publishing state. Use `ENABLE` to publish and `DIS_ENABLE` to unpublish.
      enum:
        - INIT
        - ENABLE
        - DIS_ENABLE
        - FAIL
    ListingBaseParameter:
      type: object
      properties:
        buildYear:
          type: string
        washRoom:
          type: integer
          description: Number of bathrooms.
        propertyFee:
          type: string
          description: Service charge.
        occupancy:
          type: string
        position:
          type: string
          description: Coordinates as "latitude,longitude".
        amenities:
          type: string
        totalFloor:
          type: string
        parking:
          type: integer
        previousPrice:
          type: string
        isMortgage:
          type: string
          description: Mortgage status.
          enum:
            - HAS
            - NONE
    ListingSyncParameter:
      allOf:
        - $ref: '#/components/schemas/ListingBaseParameter'
        - type: object
          properties:
            permitNumber:
              type: string
            permitExpireDate:
              type: string
              description: Format "yyyy-MM-dd HH:mm:ss".
            permitUrl:
              type: string
            permitQRCode:
              type: string
            dldWaiver:
              type: string
            originalPrice:
              type: integer
            amountPaid:
              type: integer
            ownerDocs:
              type: array
              description: URLs of owner documents.
              items:
                type: string
            showPriceOnPortal:
              $ref: '#/components/schemas/PortalSwitch'
            floor:
              type: string
              description: Floor number of the unit.
            view360:
              type: string
              description: 360° tour URL.
            videoLink:
              type: string
            rentExpiry:
              type: string
              description: Format "yyyy-MM-dd HH:mm:ss".
    ListingAddRequest:
      type: object
      required:
        - name
        - propertyType
        - houseType
      properties:
        name:
          type: string
          description: Listing title.
        propertyType:
          $ref: '#/components/schemas/ListingType'
        houseType:
          type: array
          description: Property (house) type(s).
          items:
            $ref: '#/components/schemas/HouseType'
        status:
          $ref: '#/components/schemas/ListingStatus'
        agentId:
          type: integer
          format: int64
          description: ID of the Pixxi agent assigned to the listing (see **Get Agents List**).
        propertyId:
          type: string
          maxLength: 40
          description: Listing reference number. Must be unique. Auto-generated if omitted. Ignored on update.
        price:
          type: integer
          format: int64
        description:
          type: string
        photos:
          type: array
          description: Image URLs. The first image is used as the cover.
          items:
            type: string
        size:
          type: integer
          description: Built-up area in sqft.
        plotSize:
          type: integer
          description: Plot area in sqft.
        bedRoomNum:
          type: integer
          description: Number of bedrooms. Use 0 for studio.
        washRoom:
          type: integer
          description: Number of bathrooms.
        livingRoomNum:
          type: integer
        isFurniture:
          $ref: '#/components/schemas/FurnishingStatus'
        views:
          type: array
          items:
            $ref: '#/components/schemas/ListingView'
        unitNumber:
          type: string
        privateUnitNumber:
          type: string
        cityId:
          type: integer
          format: int64
          description: City ID (see **Search Areas**).
        regionId:
          type: integer
          format: int64
          description: Region ID (see **Search Areas**).
        communityId:
          type: integer
          format: int64
          description: Community ID (see **Search Areas**).
        developerId:
          type: integer
          format: int64
          description: Developer ID (see **Get Developers List**).
        completionStatus:
          type: string
          enum:
            - OFF_PLAN_PRIMARY
            - OFF_PLAN
            - COMPLETED_PRIMARY
            - COMPLETED
        permitNumber:
          type: string
        tagId:
          type: integer
          format: int64
          description: Listing tag ID. Defaults to the default tag for the listing type and status.
        source:
          type: string
          description: Listing source.
        propertyFinder:
          $ref: '#/components/schemas/PortalSwitch'
        bayut:
          $ref: '#/components/schemas/PortalSwitch'
        dubizzle:
          $ref: '#/components/schemas/PortalSwitch'
        ownPortal:
          $ref: '#/components/schemas/PortalSwitch'
        propertyBooster:
          $ref: '#/components/schemas/PortalSwitch'
        propertyJamesEdition:
          $ref: '#/components/schemas/PortalSwitch'
        propertyFinderPortalAgentId:
          type: integer
          format: int64
          description: Agent shown on Property Finder. Defaults to `agentId`.
        bayutPortalAgentId:
          type: integer
          format: int64
        dubizzlePortalAgentId:
          type: integer
          format: int64
        ownPortalPortalAgentId:
          type: integer
          format: int64
        propertyBoosterPortalAgentId:
          type: integer
          format: int64
        propertyJamesEditionPortalAgentId:
          type: integer
          format: int64
        sellParameter:
          description: Sell-specific details. Use when `propertyType` is `SELL`.
          allOf:
            - $ref: '#/components/schemas/ListingSyncParameter'
            - type: object
              properties:
                completionStatus:
                  type: string
                  enum:
                    - OFF_PLAN_PRIMARY
                    - OFF_PLAN
                    - COMPLETED_PRIMARY
                    - COMPLETED
                acFee:
                  type: number
                  description: AC charge.
        rentParameter:
          description: Rent-specific details. Use when `propertyType` is `RENT`.
          allOf:
            - $ref: '#/components/schemas/ListingSyncParameter'
            - type: object
              properties:
                priceType:
                  type: string
                  enum:
                    - day
                    - week
                    - month
                    - year
                  description: Rental period the main `price` refers to.
                priceYear:
                  type: string
                priceMonth:
                  type: string
                priceWeek:
                  type: string
                priceDay:
                  type: string
                cheques:
                  type: string
                  description: Number of cheques.
                deposit:
                  type: string
                availabilityDate:
                  type: string
                minimalRentalPeriod:
                  type: integer
        newParameter:
          description: New project (off-plan) details. Use when `propertyType` is `NEW`.
          allOf:
            - $ref: '#/components/schemas/ListingBaseParameter'
            - type: object
              properties:
                handoverTime:
                  type: string
                  description: Format "yyyy-MM-dd HH:mm:ss".
                developerBrochures:
                  type: array
                  items:
                    type: string
                totalUnits:
                  type: integer
                minSize:
                  type: integer
                maxSize:
                  type: integer
                bedroomMin:
                  type: string
                bedroomMax:
                  type: string
                paymentPlan:
                  type: string
                  description: JSON string, e.g. {"one":"10","two":"30","three":"60","four":0}.
                permitNumber:
                  type: string
                permitUrl:
                  type: string
                permitQRCode:
                  type: string
                style:
                  type: array
                  description: Floor plans / unit types.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      title:
                        type: string
                      imgUrl:
                        type: array
                        items:
                          type: string
                      price:
                        type: string
                      area:
                        type: number
        landlordInfo:
          type: object
          description: Landlord details stored on the listing.
          properties:
            landlordName:
              type: string
            landlordPhone:
              type: string
            secondryPhone:
              type: string
            email:
              type: string
            nationality:
              type: string
            houseNo:
              type: string
        ownerIds:
          type: string
          description: Comma-separated IDs of existing owners to link to the listing (see **Get Owners List**).
        ownerInfoType:
          type: string
          enum:
            - HAND
            - SELECT
            - ADD
          description: Set to `ADD` together with `ownerRequest` to create a new owner and link it to the listing.
        ownerRequest:
          type: object
          description: New owner to create when `ownerInfoType` is `ADD`.
          properties:
            name:
              type: string
            phone:
              type: string
            secondaryPhone:
              type: string
            email:
              type: string
            nationality:
              type: string
            unitNumber:
              type: string
            agentId:
              type: integer
              format: int64
            notes:
              type: string
