  /pixxiapi/v1/database/list:
    post:
      summary: Get Database Projects
      tags:
        - Databases
      description: |
        Retrieve a paginated list of database projects, with optional filters. All filters are optional
        and are combined with **AND**.

        Use a project's `id` as `projectId` in **Get Project Records** to list its records.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: Page number (1-based). Default is 1
                size:
                  type: integer
                  description: Number of projects per page. Default is 10
                name:
                  type: string
                  description: Return projects whose name contains this text
                recordOwnerId:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: |
                    Agent IDs (from **Get Agents List**). Returns projects where any of these agents is the project agent or a participant
                locationList:
                  type: array
                  description: |
                    Return projects in any of these locations. Within one entry, `regionIds` and `communityIds` are combined with OR. Sub-communities of each community are included
                  items:
                    type: object
                    properties:
                      regionIds:
                        type: array
                        items:
                          type: integer
                          format: int64
                      communityIds:
                        type: array
                        items:
                          type: integer
                          format: int64
                dateStart:
                  type: string
                  description: Return projects created on or after this time. Format `yyyy-MM-dd HH:mm:ss`
                  example: '2026-01-01 00:00:00'
                dateEnd:
                  type: string
                  description: Return projects created on or before this time. Format `yyyy-MM-dd HH:mm:ss`
                  example: '2026-01-31 23:59:59'
                sort:
                  type: string
                  description: Field to sort by. Applied only together with `sortType`
                  enum:
                    - ID
                    - CREATE_TIME
                    - UPDATE_TIME
                sortType:
                  type: string
                  description: Sort direction. Applied only together with `sort`
                  enum:
                    - ASC
                    - DESC
              example:
                name: Marina
                sort: CREATE_TIME
                sortType: DESC
                page: 1
                size: 10
      responses:
        '200':
          description: Successful response
  /pixxiapi/v1/database/records/list:
    post:
      summary: Get Project Records
      tags:
        - Databases
      description: |
        Retrieve a paginated list of database records, with optional filters.

        All filters are optional and are combined with **AND**. Omit a filter (or send `null` / an empty
        list) to skip it. With no filters, records from every database project are returned.

        ### Common searches

        | Goal | Request body |
        |------|--------------|
        | All records in one project | `{"projectId": 123}` |
        | Find a record by phone number | `{"name": "501234567"}` |
        | Search by name, ID or unit number | `{"name": "John"}` |
        | One record by ID | `{"id": 4567}` |
        | Records in a project with given statuses | `{"projectId": 123, "statusList": ["FOLLOW_UP", "NO_ANSWER"]}` |

        Get project IDs from **Get Database Projects**.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: Page number (1-based). Default is 1
                size:
                  type: integer
                  description: Number of records per page. Default is 10
                id:
                  type: integer
                  format: int64
                  description: Return only the record with this ID
                projectId:
                  type: integer
                  format: int64
                  description: Return only records in this database project (`id` from **Get Database Projects**)
                name:
                  type: string
                  description: |
                    Keyword search. Matches records whose name contains the keyword, whose ID equals it, whose unit number starts with it, or (when the keyword is longer than 5 characters) whose primary or secondary contact number contains it. Spaces are ignored.
                countryCodes:
                  type: array
                  items:
                    type: string
                  description: |
                    Return records whose primary or secondary number starts with any of these country codes, with or without a leading `+`, `0` or `00`. Example: `["971", "+44"]`
                statusList:
                  type: array
                  description: Return records with any of these statuses. `PENDING` also matches records with no status
                  items:
                    type: string
                    enum:
                      - PENDING
                      - NO_ANSWER
                      - FOLLOW_UP
                      - SOLD
                      - WRONG_NUMBER
                      - VIEWED
                      - AVOID_CALLING
                      - RENTED
                      - NO_INTERESTED
                      - MESSAGED
                      - SWITCHED_OFF
                unitNumbers:
                  type: array
                  items:
                    type: string
                  description: Return records whose unit number ends with any of these values (spaces ignored)
                rooms:
                  type: array
                  items:
                    type: string
                  description: Return records whose rooms value exactly equals any of these, for example `["1", "2"]`
                minSize:
                  type: string
                  description: Minimum total area, as a numeric string, for example `"800"`
                maxSize:
                  type: string
                  description: Maximum total area, as a numeric string, for example `"1500"`
                nationalityList:
                  type: array
                  items:
                    type: string
                  description: Return records with any of these nationalities (exact match)
                recordOwnerId:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: |
                    Agent IDs (from **Get Agents List**). Returns records in projects where any of these agents is the project agent or a participant
                dateStart:
                  type: string
                  description: Return records last viewed on or after this time. Format `yyyy-MM-dd HH:mm:ss`
                  example: '2026-01-01 00:00:00'
                dateEnd:
                  type: string
                  description: Return records last viewed on or before this time. Format `yyyy-MM-dd HH:mm:ss`
                  example: '2026-01-31 23:59:59'
                sort:
                  type: string
                  description: Sort by record ID
                  enum:
                    - ID
                sortType:
                  type: string
                  description: Direction for `sort`. Default is `DESC`
                  enum:
                    - ASC
                    - DESC
            examples:
              byProject:
                summary: All records in a project
                value:
                  projectId: 123
                  page: 1
                  size: 10
              byPhone:
                summary: Find a record by phone number
                value:
                  name: '501234567'
                  page: 1
                  size: 10
              filtered:
                summary: Combined filters
                value:
                  projectId: 123
                  statusList:
                    - FOLLOW_UP
                    - NO_ANSWER
                  countryCodes:
                    - '971'
                  sort: ID
                  sortType: DESC
                  page: 1
                  size: 20
      responses:
        '200':
          description: Successful response
