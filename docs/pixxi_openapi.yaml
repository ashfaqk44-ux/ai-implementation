  /pixxiapi/webhook/v1/subscribe:
    post:
      summary: Subscribe to Webhook Events
      tags:
        - Webhooks API
      description: Subscribe to webhook events to receive real-time notifications when specific events occur in Pixxi CRM.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - callbackUrl
              properties:
                event:
                  type: string
                  enum:
                    - ADD_LEADS
                    - UPDATE_LEADS
                    - ADD_LEAD_NOTE
                    - ADD_REMINDER
                    - ADD_LISTINGS
                    - UPDATE_LISTINGS
                    - DELETE_LISTINGS
                    - ADD_NOTIFICATIONS
                    - ADD_PORTAL_LEAD
                    - UPDATE_PORTAL_LEAD
                  description: The event type to subscribe to
                callbackUrl:
                  type: string
                  format: uri
                  description: The webhook URL where notifications will be sent
              example:
                event: UPDATE_LEADS
                callbackUrl: https://example.com/webhook
      responses:
        '200':
          description: Subscription successful
          content:
            application/json:
              example:
                statusCode: 200
                message: success
                data: true
        '400':
          description: Bad request, invalid input data
        '500':
          description: Server error
  /pixxiapi/webhook/v1/unsubscribe:
    post:
      summary: Unsubscribe from Webhook Events
      tags:
        - Webhooks API
      description: Unsubscribe from webhook events to stop receiving notifications.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - url
              properties:
                event:
                  type: string
                  enum:
                    - ADD_LEADS
                    - UPDATE_LEADS
                    - ADD_LEAD_NOTE
                    - ADD_REMINDER
                    - ADD_LISTINGS
                    - UPDATE_LISTINGS
                    - DELETE_LISTINGS
                    - ADD_NOTIFICATIONS
                    - ADD_PORTAL_LEAD
                    - UPDATE_PORTAL_LEAD
                  description: The event type to unsubscribe from
                url:
                  type: string
                  format: uri
                  description: The webhook URL to stop receiving notifications
              example:
                event: UPDATE_LEADS
                url: https://example.com/webhook
      responses:
        '200':
          description: Unsubscription successful
          content:
            application/json:
              example:
                statusCode: 200
                message: success
                data: true
        '400':
          description: Bad request, invalid input data
        '500':
          description: Server error
  /pixxiapi/webhook/v1/subscription/list:
    get:
      summary: List Webhook Subscriptions
      tags:
        - Webhooks API
      description: Retrieve a list of all webhook subscriptions for the tenant. Optionally filter by event type.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
        - name: event
          in: query
          required: false
          schema:
            type: string
            enum:
              - ADD_LEADS
              - UPDATE_LEADS
              - ADD_LEAD_NOTE
              - ADD_REMINDER
              - ADD_LISTINGS
              - UPDATE_LISTINGS
              - DELETE_LISTINGS
              - ADD_NOTIFICATIONS
              - ADD_PORTAL_LEAD
              - UPDATE_PORTAL_LEAD
          description: Filter subscriptions by event type
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Subscription ID
                        tenantId:
                          type: integer
                          description: Tenant ID
                        event:
                          type: string
                          enum:
                            - ADD_LEADS
                            - UPDATE_LEADS
                            - ADD_LEAD_NOTE
                            - ADD_REMINDER
                            - ADD_LISTINGS
                            - UPDATE_LISTINGS
                            - DELETE_LISTINGS
                            - ADD_NOTIFICATIONS
                            - ADD_PORTAL_LEAD
                            - UPDATE_PORTAL_LEAD
                          description: Event type
                        callbackUrl:
                          type: string
                          format: uri
                          description: Webhook callback URL
                        status:
                          type: string
                          description: Subscription status
                        createTime:
                          type: string
                          format: date-time
                          description: Subscription creation timestamp
                        updateTime:
                          type: string
                          format: date-time
                          description: Subscription last update timestamp
              example:
                statusCode: 200
                message: success
                data:
                  - id: 1
                    tenantId: 123
                    event: UPDATE_LEADS
                    callbackUrl: https://example.com/webhook/leads
                    status: ACTIVE
                    createTime: '2026-02-01 10:30:00'
                    updateTime: '2026-02-06 14:18:21'
                  - id: 2
                    tenantId: 123
                    event: ADD_LISTINGS
                    callbackUrl: https://example.com/webhook/listings
                    status: ACTIVE
                    createTime: '2026-02-02 09:15:00'
                    updateTime: '2026-02-06 14:18:21'
        '400':
          description: Bad request, invalid input data
        '500':
          description: Server error
  /pixxiapi/v1/owner/list:
    post:
      summary: Get Owners List
      tags:
        - Owners
      description: Retrieve a paginated list of property owners with filtering and sorting options.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
