  /pixxiapi/v1/portalLead/addTag:
    post:
      summary: Tag a Portal Lead
      tags:
        - Portal Leads
      description: |
        Tag a portal lead to an existing record in Pixxi CRM (buy lead, rent lead, listing, agent, or other).

        **Supported `tagType` values:**
        | tagType | Description |
        |---|---|
        | `buy_lead` | Links the portal lead to a buy lead. `tagItemId` = buy lead ID |
        | `rent_lead` | Links the portal lead to a rent lead. `tagItemId` = rent lead ID |
        | `sell_listing` | Links the portal lead to a sell listing. `tagItemId` = listing ID |
        | `rent_listing` | Links the portal lead to a rent listing. `tagItemId` = listing ID |
        | `agent` | Tags the portal lead as an agent. `tagItemId` is not needed |
        | `other` | Tags the portal lead as "other". `tagItemId` is not needed |
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - portalLeadId
                - tagType
              properties:
                portalLeadId:
                  type: integer
                  description: ID of the portal lead to tag.
                tagType:
                  type: string
                  description: Type of tag to apply.
                  enum:
                    - buy_lead
                    - rent_lead
                    - sell_listing
                    - rent_listing
                    - agent
                    - other
                tagItemId:
                  type: integer
                  description: ID of the item to link the portal lead to (lead ID, listing ID, agent ID, etc.).
              example:
                portalLeadId: 9876
                tagType: buy_lead
                tagItemId: 842115
      responses:
        '200':
          description: Portal lead tagged successfully
          content:
            application/json:
              example:
                statusCode: 200
                message: success
                data: success
        '400':
          description: Bad request, invalid tag type or missing fields
        '500':
          description: Server error
