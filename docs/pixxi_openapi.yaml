openapi: 3.1.0
info:
  title: Pixxi Data API
  version: 1.0.0
servers:
  - url: https://dataapi.pixxicrm.ae
tags:
  - name: Introduction
    description: |
      Welcome to the Pixxi Data API.  

      This API allows real estate companies to connect their websites with Pixxi

      Publish listings to your website and receive leads directly on Pixxi from the website forms

      Use the sections below to explore available endpoints.
  - name: Rate Limits
    description: |
      All API endpoints are subject to rate limiting to ensure fair usage and platform stability.

      ### Request Limits

      | Limit | Value |
      |---|---|
      | **Max requests per hour** | 2,000 per token |
      | **Min interval between requests** | 2 seconds |
      | **Max page size** | 500 records per page |

      If you exceed the rate limit, the API will return a `429 Too Many Requests` response. Wait for the cooldown period before retrying.

      > **Note:** The 2-second minimum interval does not apply to requests that create or update data (e.g., Submit Lead Form, Update Lead) to prevent any data loss.

      ### Best Practices

      - Use pagination with a reasonable `size` (up to 500) to retrieve large datasets efficiently.
      - Space your requests at least 2 seconds apart to avoid throttling.
      - Cache responses where possible to reduce unnecessary API calls.
  - name: Authentication
    description: |
      To integrate with our API, you will need your X-PIXXI-TOKEN.

      Log in to Pixxi CRM > Admin > Integrations > Pixxi Forms to retrieve your token.
  - name: Listings
    description: |
      This API allows you to fetch your listings from
      Pixxi CRM. The API provides endpoints for retrieving filtered listings based on various query
      parameters. This document will guide you on how to use the API effectively..
  - name: Leads
    description: |
      This API allows you to submit leads from your website forms to Pixxi CRM.

      Use the endpoints below to submit lead forms.
  - name: Developers
    description: |
      This API allows you to fetch developers from Pixxi CRM.

      Use the endpoints below to retrieve developer information.
  - name: Areas
    description: |
      This API allows you to search for cities, regions, or communities by name.

      Use the endpoints below to search for areas in Pixxi CRM.
  - name: Agents
    description: |
      This API allows you to get the list of all agents
  - name: Databases
    description: |
      This API allows you to get databases projects and records and add notes to a record
  - name: Reminders
    description: |
      This API allows you to manage Pixxi Tasks, Events, and Viewings
  - name: Owners
    description: |
      This API allows you to manage property owners in Pixxi CRM.

      Use the endpoints below to list owners, add new owners, and log owner activity.
  - name: Listing Management
    description: |
      This API is for integrations that work with your listings in Pixxi CRM, such as syncing listings
      with an external system, back-office tool, or another platform. Use it to create, update,
      delete, and list listings.

      It covers **all listings in your account**, not only the ones published to your website.
      If you only need the listings published on your website, use the **Listings** endpoints instead.

      ### Permissions

      These endpoints require an API key (`X-PIXXI-TOKEN`) with the **Listings & Owners** permission
      enabled. Requests made with a key that doesn't have this permission are rejected with a
      permission error.
  - name: Portal Leads
    description: |
      This API allows you to manage portal leads (external call logs) in Pixxi CRM.

      Use the endpoints below to list portal leads and tag them to leads, listings, or agents.
  - name: Matches
    description: |
      This API allows you to retrieve lead-to-listing match results from Pixxi CRM.

      Use the endpoints below to query matching scores between leads and listings.
  - name: Performance
    description: |
      This API allows you to retrieve performance and statistics from Pixxi CRM.

      Use the endpoints below to query performance data.
  - name: Custom Contact Buttons
    description: |
      Custom contact buttons appear in the Contact Info of records in Pixxi CRM. Each button opens a
      link that contains a `{value}` placeholder, for example `https://app.example.com/conversations/{value}`.

      For **Custom Channel** buttons, `{value}` is a value you store for each record through this API,
      such as a conversation or contact ID in your system. A Custom Channel button only appears on records
      that have a value. Account admins create the buttons in Pixxi CRM > Control Center > Contact Buttons.

      ### How to use it

      1. Get the button's `id` with `GET /pixxiapi/v1/custom-contact-buttons`.
      2. Store a value for a record with `PUT /pixxiapi/v1/custom-contact-buttons/value`.
      3. Clear it with `DELETE /pixxiapi/v1/custom-contact-buttons/value` when it no longer applies.

      ### Record types

      A record is identified by `bizType` and `bizId`:

      | bizType | Record | bizId |
      |---|---|---|
      | `LEAD` | Buy or rent lead | Lead `id` (from **Get Leads List**) |
      | `OWNER` | Owner | Owner `id` (from **Get Owners List**) |
      | `PORTAL_LEAD` | Portal lead | Portal lead `id` (from **Get Portal Leads List**) |
      | `DATABASE` | Database record | Record `id` (from **Get Project Records**) |

      ### Permissions

      If your API key (`X-PIXXI-TOKEN`) has permissions set, `LEAD` records need the **Leads** permission
      and `OWNER` records need the **Listings & Owners** permission.

      ### Notes

      - Values are kept when a button is disabled, and show again when it is enabled.
      - Deleting a button in Pixxi CRM also deletes all its stored values.
  - name: Webhooks API
    description: |
      This API allows you to subscribe to and manage webhooks for various events in Pixxi CRM.

      Use the endpoints below to subscribe to events and receive real-time notifications about changes.
  - name: Events
    description: |
      Pixxi CRM fires the following events to your registered callback URL.

      Each event sends a `POST` request whose JSON body is the event's object itself (for example, the lead or listing). The body is not wrapped and does **not** include the event name, so register a separate callback URL for each event (for example, `/webhooks/pixxi/add-leads`) to tell them apart.

      Subscribe to any event using `POST /pixxiapi/webhook/v1/subscribe`.
