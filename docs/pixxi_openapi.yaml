  /pixxiapi/v1/property/activity-logs:
    post:
      summary: Get Property Activity Logs
      tags:
        - Listings
      description: List activity logs for a given property, with optional filters.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                propertyId:
                  type: integer
                  description: ID of the property.
                type:
                  type: string
                  description: Filter logs by type. Can be Activity or Portal Error.
                  enum:
                    - Activity
                    - Portal Error
                dateStart:
                  type: string
                  format: datetime
                  description: Filter logs after this date (yyyy-MM-dd HH:mm:ss).
                dateEnd:
                  type: string
                  format: datetime
                  description: Filter logs before this date (yyyy-MM-dd HH:mm:ss).
                page:
                  type: integer
                  description: Page number for pagination. Default is 1.
                size:
                  type: integer
                  description: Page size for pagination. Default is 10.
              required:
                - propertyId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      offset:
                        type: integer
                      totalSize:
                        type: integer
                      totalPages:
                        type: integer
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            createdBy:
                              type: integer
                            message:
                              type: string
                            type:
                              type: string
                              enum:
                                - Activity
                                - Portal Error
                            portal:
                              type: string
                              description: The portal name, e.g. Property Finder or Bayut. (Only present for Portal Error type)
                            extend:
                              type: string
                            createTime:
                              type: string
                              format: datetime
        '400':
          description: Bad request
        '500':
          description: Server error
