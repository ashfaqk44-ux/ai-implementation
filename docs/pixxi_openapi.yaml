  /pixxiapi/v1/owner/addLog/{appName}:
    post:
      summary: Add Owner Activity Log
      tags:
        - Owners
      description: Add a new activity log entry to an existing owner record. Supports both plain-text messages and call recording URLs.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
        - name: appName
          in: path
          required: true
          schema:
            type: string
          description: The name of the application adding the log (e.g., "BrightCall", "MyApp").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: integer
                  description: ID of the owner to add the log to.
                message:
                  type: string
                  description: Log message. Required when callRecordingUrl is not provided.
                callRecordingUrl:
                  type: string
                  description: URL of a call recording. When provided, the log is saved as a call follow-up instead of a plain message.
              required:
                - ownerId
              example:
                ownerId: 54321
                message: Called owner, interested in selling unit 302.
      responses:
        '200':
          description: Activity log added successfully
        '400':
          description: Bad request, invalid input data
        '500':
          description: Server error
  /integration/v1/property:
    post:
      summary: Add Listing
      tags:
        - Listing Management
      description: |
        Create a new listing in Pixxi CRM.

        - `name`, `propertyType` and `houseType` are required.
        - `agentId` is the Pixxi agent who will be set as the creator and assigned agent of the listing.
        - `propertyId` (reference number) is optional; if omitted Pixxi generates one. If provided it must be unique and at most 40 characters.
        - Owners can be linked by passing existing owner IDs in `ownerIds` (comma-separated), or created inline by setting `ownerInfoType` to `ADD` and providing `ownerRequest`.
        - Listings that are not `POTENTIAL` go through your configured approval workflow, if any.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingAddRequest'
            example:
              name: Spacious 2BR in JVC
              propertyType: SELL
              houseType:
                - APARTMENT
              status: ACTIVE
              agentId: 2031
              price: 1450000
              size: 1250
              bedRoomNum: 2
              washRoom: 3
              isFurniture: NONE
              cityId: 44
              regionId: 35
              communityId: 163
              developerId: 12
              unitNumber: '1204'
              description: Bright 2 bedroom apartment with balcony and community view.
              photos:
                - https://example.com/photos/1.jpg
                - https://example.com/photos/2.jpg
              views:
                - COMMUNITY_VIEW
              ownPortal: ENABLE
              sellParameter:
                completionStatus: COMPLETED
                buildYear: '2019'
                parking: 1
                occupancy: Vacant
              ownerIds: '54321'
      responses:
        '200':
          description: Listing created successfully. `data` contains the created listing.
          content:
            application/json:
              example:
                statusCode: 200
                message: success
                data:
                  id: 351100
                  propertyId: '1003101351100'
                  name: Spacious 2BR in JVC
                  propertyType: SELL
                  houseType:
                    - APARTMENT
                  status: ACTIVE
                  price: 1450000
                  size: 1250
                  bedRoomNum: 2
                  agentId: 2031
                  cityId: 44
                  regionId: 35
                  communityId: 163
                  ownPortal: ENABLE
                  ownerIds: '54321'
                  createTime: '2026-10-16 10:30:00'
        '400':
          description: |
            Bad request. Possible messages include:
            - `Property name is require` / `Property type is require` / `House type is require`
            - `The <propertyId> already exists!`
            - `The length of <propertyId> cannot be greater than 40!`
            - `X-PIXXI-TOKEN_MISSING` / `X-PIXXI-TOKEN_ERROR`
            - `No permission to access website listings`
        '500':
          description: Server error
    put:
      summary: Update Listing
      tags:
        - Listing Management
      description: |
        Update an existing listing. Pass the listing `id` along with the fields to change; all other
        fields accept the same values as **Add Listing**.

        - `propertyId` (reference number) cannot be changed and is ignored on update.
        - If `agentId` is omitted, the listing keeps its current agent.
        - Updates to non-`POTENTIAL` listings go through your configured approval workflow, if any.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required:
                    - id
                  properties:
                    id:
                      type: integer
                      format: int64
                      description: Pixxi internal ID of the listing to update.
                - $ref: '#/components/schemas/ListingAddRequest'
            example:
              id: 351100
              name: Spacious 2BR in JVC - Price Reduced
              propertyType: SELL
              houseType:
                - APARTMENT
              price: 1380000
              status: ACTIVE
      responses:
        '200':
          description: Listing updated successfully. `data` contains the updated listing.
          content:
            application/json:
              example:
                statusCode: 200
                message: success
                data:
                  id: 351100
                  propertyId: '1003101351100'
                  name: Spacious 2BR in JVC - Price Reduced
                  propertyType: SELL
                  houseType:
                    - APARTMENT
                  status: ACTIVE
                  price: 1380000
                  agentId: 2031
                  updateTime: '2026-10-16 11:00:00'
        '400':
          description: |
            Bad request (e.g. listing not found, invalid enum value, `X-PIXXI-TOKEN_ERROR`, or `No permission to access listings`).
        '500':
          description: Server error
    delete:
      summary: Delete Listings
      tags:
        - Listing Management
      description: |
        Delete one or more listings in a single request.

        The response contains one entry per requested listing, mapping its `id` to the result:
        - `true` — the listing was deleted.
        - `false` — the deletion requires approval and was submitted to your approval workflow instead of being deleted immediately.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idList
              properties:
                idList:
                  type: array
                  description: Listings to delete.
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: Pixxi internal ID of the listing.
            example:
              idList:
                - id: 351100
                - id: 351101
      responses:
        '200':
          description: Deletion processed.
          content:
            application/json:
              example:
                statusCode: 200
                message: success
                data:
                  - '351100': true
                  - '351101': false
        '400':
          description: Bad request (e.g. listing not found, `X-PIXXI-TOKEN_ERROR`, or `No permission to access listings`).
        '500':
          description: Server error
  /integration/v1/property/list:
    post:
      summary: Get Listings List
      tags:
        - Listing Management
      description: |
        Retrieve a paginated list of **all** listings in your account (not only those published to your website),
        with filtering and sorting options.

        Rate limited to 2,000 requests per hour with a minimum interval of 2 seconds between requests.
      parameters:
        - name: X-PIXXI-TOKEN
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  default: 1
                  description: Page number (1-based).
                size:
                  type: integer
                  default: 10
                  description: Number of results per page (max 500).
                sort:
                  type: string
                  description: Field to sort by (e.g., ID, CREATE_TIME, UPDATE_TIME).
                sortType:
                  type: string
                  enum:
                    - ASC
                    - DESC
                  description: Sort direction.
                dateStart:
                  type: string
                  description: Filter by creation date start, format "yyyy-MM-dd HH:mm:ss".
                dateEnd:
                  type: string
                  description: Filter by creation date end, format "yyyy-MM-dd HH:mm:ss".
                name:
                  type: string
                  description: Filter by listing title (partial match) or exact reference number (`propertyId`).
                listingType:
                  $ref: '#/components/schemas/ListingType'
                status:
                  $ref: '#/components/schemas/ListingStatus'
                propertyType:
                  type: array
                  description: Filter by house type.
                  items:
                    $ref: '#/components/schemas/HouseType'
                bedRoomNum:
                  type: array
                  description: Filter by number of bedrooms (0 = studio).
                  items:
                    type: integer
                cityIds:
                  type: array
                  items:
                    type: integer
                regionIds:
                  type: array
                  items:
                    type: integer
                communityIds:
                  type: array
                  description: Filter by community. Sub-communities of the given communities are included.
                  items:
                    type: integer
                developerIds:
                  type: array
                  items:
                    type: integer
                agentIds:
                  type: array
                  items:
                    type: integer
                startPrice:
                  type: integer
                  description: Minimum price. Applied only when `endPrice` is also provided.
                endPrice:
                  type: integer
                  description: Maximum price. Applied only when `startPrice` is also provided.
                ssize:
                  type: integer
                  description: Minimum size in sqft. Applied only when `esize` is also provided.
                esize:
                  type: integer
                  description: Maximum size in sqft. Applied only when `ssize` is also provided.
                completionStatus:
                  type: string
                  enum:
                    - OFF_PLAN_PRIMARY
                    - OFF_PLAN
                    - COMPLETED_PRIMARY
                    - COMPLETED
                  description: Filter Sell listings by completion status.
                publishedOnAnyPortal:
                  type: boolean
                  description: When `true`, return only listings published on at least one portal. When set, the individual portal filters below are ignored.
                propertyFinder:
                  $ref: '#/components/schemas/PortalSwitch'
                bayut:
                  $ref: '#/components/schemas/PortalSwitch'
                dubizzle:
                  $ref: '#/components/schemas/PortalSwitch'
                ownPortal:
                  $ref: '#/components/schemas/PortalSwitch'
                propertyBooster:
                  $ref: '#/components/schemas/PortalSwitch'
                propertyJamesEdition:
                  $ref: '#/components/schemas/PortalSwitch'
            example:
              page: 1
              size: 20
              sort: ID
              sortType: DESC
              listingType: SELL
              status: ACTIVE
              propertyType:
                - APARTMENT
              bedRoomNum:
                - 1
                - 2
              communityIds:
                - 163
              startPrice: 0
              endPrice: 2000000
              publishedOnAnyPortal: true
      responses:
        '200':
          description: |
            Successful response. Each item in `list` has the same structure as the items returned by
            **Get Website Listings** (`POST /pixxiapi/v1/properties`).
